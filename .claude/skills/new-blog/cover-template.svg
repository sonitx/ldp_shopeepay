<!--
  Mẫu ảnh bìa blog 1200×630. Sao chép thành public/images/blog/src/<slug>.svg rồi thay:
    {{PRIMARY}} {{PRIMARY_DARK}}  — màu từ --color-primary / --color-primary-dark (public/css/style.css)
    {{KICKER}}                    — nhãn ngắn (vd "HƯỚNG DẪN", "ƯU ĐÃI"), ≤ 20 ký tự
    {{TITLE_LINE_1}} {{TITLE_LINE_2}} — tiêu đề ngắn gọn, mỗi dòng ≤ 17 ký tự (cỡ 64px; dài hơn sẽ đè lên hình minh hoạ)
    {{SUBTITLE}}                  — 1 dòng ≤ 40 ký tự
    {{SITE_NAME}}                 — site.name
    {{ILLUSTRATION}}              — hình minh hoạ vẽ bằng hình khối trong vùng x 700–1140, y 70–560
  KHÔNG dùng emoji (rsvg-convert render lỗi). Xuất PNG:
    rsvg-convert -w 1200 -h 630 public/images/blog/src/<slug>.svg -o public/images/blog/<slug>.png
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f4"/>
      <stop offset="1" stop-color="#ffe6dc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="{{PRIMARY}}"/>
      <stop offset="1" stop-color="{{PRIMARY_DARK}}"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="{{PRIMARY}}" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="315" r="300" fill="{{PRIMARY}}" opacity="0.07"/>
  <circle cx="930" cy="315" r="200" fill="{{PRIMARY}}" opacity="0.07"/>
  <rect x="0" y="0" width="14" height="630" fill="url(#brand)"/>

  <!-- Chữ bên trái -->
  <rect x="80" y="120" width="220" height="44" rx="22" fill="{{PRIMARY}}"/>
  <text x="190" y="149" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">{{KICKER}}</text>
  <text x="80" y="260" font-size="64" font-weight="700" fill="#1f1a17">{{TITLE_LINE_1}}</text>
  <text x="80" y="340" font-size="64" font-weight="700" fill="{{PRIMARY}}">{{TITLE_LINE_2}}</text>
  <text x="80" y="410" font-size="28" fill="#5b524d">{{SUBTITLE}}</text>
  <rect x="80" y="500" width="44" height="44" rx="11" fill="url(#brand)"/>
  <rect x="90" y="513" width="24" height="18" rx="4" fill="#fff"/>
  <text x="140" y="531" font-size="24" font-weight="700" fill="#1f1a17">{{SITE_NAME}}</text>

  <!-- Hình minh hoạ bên phải -->
  <g filter="url(#shadow)">
    {{ILLUSTRATION}}
  </g>
</svg>
