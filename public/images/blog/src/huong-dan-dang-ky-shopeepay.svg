<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f4"/>
      <stop offset="1" stop-color="#ffe6dc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee4d2d"/>
      <stop offset="1" stop-color="#d0391b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#ee4d2d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="315" r="300" fill="#ee4d2d" opacity="0.07"/>
  <circle cx="930" cy="315" r="200" fill="#ee4d2d" opacity="0.07"/>
  <rect x="0" y="0" width="14" height="630" fill="url(#brand)"/>

  <!-- Chữ bên trái -->
  <rect x="80" y="120" width="220" height="44" rx="22" fill="#ee4d2d"/>
  <text x="190" y="149" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">HƯỚNG DẪN</text>
  <text x="80" y="260" font-size="64" font-weight="700" fill="#1f1a17">Đăng ký</text>
  <text x="80" y="340" font-size="64" font-weight="700" fill="#ee4d2d">ShopeePay</text>
  <text x="80" y="410" font-size="28" fill="#5b524d">4 bước nhận voucher 1 triệu</text>
  <rect x="80" y="500" width="44" height="44" rx="11" fill="url(#brand)"/>
  <rect x="90" y="513" width="24" height="18" rx="4" fill="#fff"/>
  <text x="140" y="531" font-size="24" font-weight="700" fill="#1f1a17">Ví ShopeePay</text>

  <!-- Hình minh hoạ bên phải -->
  <g filter="url(#shadow)">
    <rect x="820" y="80" width="230" height="440" rx="36" fill="#1f1a17"/>
<rect x="832" y="92" width="206" height="416" rx="26" fill="#fff"/>
<rect x="905.0" y="102" width="60" height="8" rx="4" fill="#1f1a17" opacity="0.3"/>
<g transform="translate(832,124)"><text x="103.0" y="44" font-size="20" font-weight="700" fill="#1f1a17" text-anchor="middle">Đăng ký</text><rect x="16" y="80" width="174" height="46" rx="12" fill="#fff1ec"/>
<text x="32" y="110" font-size="17"  fill="#5b524d">Số điện thoại</text><rect x="16" y="140" width="174" height="46" rx="12" fill="#fff1ec"/>
<text x="32" y="170" font-size="17"  fill="#5b524d">Mã OTP</text><rect x="16" y="200" width="174" height="46" rx="12" fill="#fff1ec"/>
<text x="32" y="230" font-size="17"  fill="#5b524d">Mã PIN</text><rect x="16" y="290" width="174" height="50" rx="25" fill="#ee4d2d"/>
<text x="103.0" y="322" font-size="18" font-weight="700" fill="#fff" text-anchor="middle">Tiếp tục</text></g><rect x="690" y="480" width="250" height="80" rx="18" fill="#fff"/>
<circle cx="726" cy="520.0" r="18" fill="#fff1ec"/><path d="M717 520.0 l7 7 l12 -14" fill="none" stroke="#ee4d2d" stroke-width="5" stroke-linecap="round"/>
<text x="756" y="516.0" font-size="20" font-weight="700" fill="#ee4d2d">Đăng ký xong</text>
<text x="756" y="542.0" font-size="16" fill="#5b524d">Nhận voucher 1 triệu</text>
