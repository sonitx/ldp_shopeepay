<text x="20" y="86" font-size="32" font-weight="700" fill="#fff">1.000.000đ</text><rect x="16" y="140" width="82" height="82" rx="14" fill="#fff1ec"/><text x="57" y="188" font-size="15" font-weight="700" fill="#ee4d2d" text-anchor="middle">Voucher</text><rect x="108" y="140" width="82" height="82" rx="14" fill="#fff1ec"/><text x="149" y="188" font-size="15" font-weight="700" fill="#ee4d2d" text-anchor="middle">Quét QR</text><rect x="16" y="236" width="82" height="82" rx="14" fill="#fff1ec"/><text x="57" y="284" font-size="15" font-weight="700" fill="#ee4d2d" text-anchor="middle">Dịch vụ</text><rect x="108" y="236" width="82" height="82" rx="14" fill="#fff1ec"/><text x="149" y="284" font-size="15" font-weight="700" fill="#ee4d2d" text-anchor="middle">SPayLater</text></g><circle cx="1100" cy="150" r="44" fill="#ffc53d"/><circle cx="1100" cy="150" r="35" fill="none" stroke="#e8a317" stroke-width="5"/>
<text x="1100" y="162.32" font-size="32" font-weight="700" fill="#8a5a00" text-anchor="middle">XU</text>
