<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f4"/>
      <stop offset="1" stop-color="#ffe6dc"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ee4d2d"/>
      <stop offset="1" stop-color="#d0391b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#ee4d2d" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="930" cy="315" r="300" fill="#ee4d2d" opacity="0.07"/>
  <circle cx="930" cy="315" r="200" fill="#ee4d2d" opacity="0.07"/>
  <rect x="0" y="0" width="14" height="630" fill="url(#brand)"/>

  <!-- Chữ bên trái -->
  <rect x="80" y="120" width="220" height="44" rx="22" fill="#ee4d2d"/>
  <text x="190" y="149" font-size="20" font-weight="700" fill="#fff" text-anchor="middle" letter-spacing="1">TÍNH NĂNG</text>
  <text x="80" y="260" font-size="64" font-weight="700" fill="#1f1a17">SPayLater là gì?</text>
  <text x="80" y="340" font-size="64" font-weight="700" fill="#ee4d2d">Mua trước trả sau</text>
  <text x="80" y="410" font-size="28" fill="#5b524d">Chi tiêu linh hoạt, trả đúng kỳ</text>
  <rect x="80" y="500" width="44" height="44" rx="11" fill="url(#brand)"/>
  <rect x="90" y="513" width="24" height="18" rx="4" fill="#fff"/>
  <text x="140" y="531" font-size="24" font-weight="700" fill="#1f1a17">Ví ShopeePay</text>

  <!-- Hình minh hoạ bên phải -->
  <g filter="url(#shadow)">
    <rect x="740" y="150" width="380" height="230" rx="26" fill="#ee4d2d"/><rect x="740" y="205" width="380" height="40" fill="#d0391b"/>
<rect x="770" y="290" width="70" height="50" rx="8" fill="#ffc53d"/><text x="1090" y="190" font-size="30" font-weight="700" fill="#fff" text-anchor="end">SPayLater</text>
<rect x="860" y="330" width="220" height="200" rx="20" fill="#fff"/><rect x="860" y="330" width="220" height="56" rx="20" fill="#1f1a17"/><rect x="860" y="360" width="220" height="26" fill="#1f1a17"/>
<text x="970" y="368" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">KỲ TRẢ</text>
<rect x="880" y="405" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="930" y="405" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="980" y="405" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="1030" y="405" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="880" y="443" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="930" y="443" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="980" y="443" width="36" height="26" rx="6" fill="#ee4d2d"/><rect x="1030" y="443" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="880" y="481" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="930" y="481" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="980" y="481" width="36" height="26" rx="6" fill="#fff1ec"/><rect x="1030" y="481" width="36" height="26" rx="6" fill="#fff1ec"/>
  </g>
